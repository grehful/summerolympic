<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <title>100m 달리기</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game.css">
  <link rel="stylesheet" href="sprint.css">
</head>
<body>
  <!-- 1. 플레이어 설정 -->
  <div id="setup" class="screen"></div>

  <!-- 2. 경기 화면 -->
  <div id="game" class="game no-select hidden">
    <header class="hud">
      <div class="hud-player"><span class="dot" id="hudDot"></span><span id="hudName"></span></div>
      <div class="hud-info"><span id="hudAttempt"></span><span id="hudBest"></span></div>
    </header>

    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>

      <div class="meters">
        <div class="meter"><div class="meter-label">시속</div><div class="meter-value"><span id="speed">0.0</span><small>km/h</small></div></div>
        <div class="meter"><div class="meter-label">기록</div><div class="meter-value"><span id="clock">0.00</span><small>초</small></div></div>
      </div>
      <div class="stamina" id="stamina">
        <div class="stamina-head"><span>스태미너</span><span id="staminaNote"></span></div>
        <div class="stamina-bar"><div class="stamina-fill" id="staminaFill"></div><div class="stamina-low"></div></div>
      </div>
      <div class="to-line" id="toLine"></div>

      <div class="banner hidden" id="banner"></div>

      <!-- 차례 안내 -->
      <div class="panel hidden" id="intro">
        <div class="intro-turn" id="introTurn"></div>
        <div class="intro-name" id="introName"></div>
        <ol class="howto">
          <li><b>"탕!"</b> 소리가 나면 <b>달리기</b> 버튼 연타! 그 전에 누르면 <b class="red">부정 출발</b> (2번이면 실격)</li>
          <li>세게 연타할수록 <b>스태미너</b>가 줄고, 살살 달리면 다시 차요. 바닥나면 지쳐서 한동안 속도가 안 나요</li>
          <li><b>90m 지점</b>(남은 10m)에서 스태미너가 꽉 차요 — 마지막 스퍼트!</li>
        </ol>
        <button type="button" class="btn btn-primary btn-block" id="introGo">준비 완료</button>
      </div>

      <!-- 레이스 결과 -->
      <div class="panel hidden" id="result">
        <div class="result-dist" id="resTime"></div>
        <div class="result-badge hidden" id="resBadge">개인 최고!</div>
        <div class="result-detail" id="resDetail"></div>
        <table class="ranking mini" id="resTable"></table>
        <button type="button" class="btn btn-primary btn-block" id="resNext"></button>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="pad pad-run" id="runBtn"><span class="pad-icon">🏃</span><span>달리기</span><small>연타! 너무 세게 하면 지쳐요</small></button>
    </div>
  </div>

  <!-- 3. 최종 결과 -->
  <div id="final" class="screen hidden">
    <div class="setup">
      <h1 class="setup-title">🏆 최종 결과</h1>
      <div class="card"><table class="ranking" id="finalTable"></table></div>
      <button type="button" class="btn btn-primary btn-block" id="againBtn">같은 선수로 다시 하기</button>
      <button type="button" class="btn btn-block" id="setupBtn">선수 다시 정하기</button>
      <a class="btn btn-ghost btn-block" href="../../">종목 선택으로</a>
    </div>
  </div>

  <script src="../../shared/js/device.js"></script>
  <script src="../../shared/js/players.js"></script>
  <script src="../../shared/js/stadium.js"></script>
  <script src="../../shared/js/athlete.js"></script>
  <script src="sprint.js"></script>
</body>
</html>
