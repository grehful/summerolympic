<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b2a">
  <title>투포환</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="../../shared/css/game.css">
  <link rel="stylesheet" href="shotput.css">
</head>
<body>
  <!-- 1. 플레이어 설정 -->
  <div id="setup" class="screen"></div>

  <!-- 2. 경기 화면 -->
  <div id="game" class="game no-select hidden">
    <header class="hud">
      <div class="hud-player"><span class="dot" id="hudDot"></span><span id="hudName"></span></div>
      <div class="hud-info"><span id="hudAttempt"></span><span id="hudBest"></span></div>
    </header>

    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>

      <div class="meters">
        <div class="meter"><div class="meter-label">속도</div><div class="meter-value"><span id="speed">0.0</span><small>km/h</small></div></div>
        <div class="meter"><div class="meter-label">각도</div><div class="meter-value"><span id="angle">--.-</span><small>°</small></div></div>
      </div>
      <div class="power" id="power">
        <div class="power-head"><span>파워</span><span id="turns"></span></div>
        <div class="power-bar"><div class="power-fill" id="powerFill"></div></div>
      </div>

      <div class="banner hidden" id="banner"></div>

      <!-- 차례 안내 -->
      <div class="panel hidden" id="intro">
        <div class="intro-turn" id="introTurn"></div>
        <div class="intro-name" id="introName"></div>
        <ol class="howto">
          <li>아래 원판에 손가락을 대고 <b>빙글빙글 원을 그리면</b> 선수가 회전해요. 빠를수록 파워 ↑</li>
          <li>2바퀴쯤 돌았으면 <b>오른쪽 위로 휙 튕기며 손을 떼세요</b> — 튕긴 방향이 던지는 각도예요 (약 40°가 최고)</li>
          <li><b>3바퀴</b>를 넘기면 서클 밖으로 나가서 <b class="red">파울</b>!</li>
        </ol>
        <button type="button" class="btn btn-primary btn-block" id="introGo">준비 완료</button>
      </div>

      <!-- 시기 결과 -->
      <div class="panel hidden" id="result">
        <div class="result-dist" id="resDist"></div>
        <div class="result-badge hidden" id="resBadge">개인 최고!</div>
        <div class="result-detail" id="resDetail"></div>
        <table class="ranking mini" id="resTable"></table>
        <button type="button" class="btn btn-primary btn-block" id="resNext"></button>
      </div>
    </div>

    <div class="controls">
      <div class="pad pad-spin" id="spinPad">
        <div class="spin-ring" id="spinRing"><div class="spin-dot" id="spinDot"></div></div>
        <div class="spin-text"><span id="padText">↻ 원을 그리다가 ↗ 휙!</span><small id="padSub">손가락을 대고 빙글빙글</small></div>
      </div>
    </div>
  </div>

  <!-- 3. 최종 결과 -->
  <div id="final" class="screen hidden">
    <div class="setup">
      <h1 class="setup-title">🏆 최종 결과</h1>
      <div class="card"><table class="ranking" id="finalTable"></table></div>
      <button type="button" class="btn btn-primary btn-block" id="againBtn">같은 선수로 다시 하기</button>
      <button type="button" class="btn btn-block" id="setupBtn">선수 다시 정하기</button>
      <a class="btn btn-ghost btn-block" href="../../">종목 선택으로</a>
    </div>
  </div>

  <script src="../../shared/js/device.js"></script>
  <script src="../../shared/js/players.js"></script>
  <script src="../../shared/js/countries.js"></script>
  <script src="../../shared/js/olympic.js"></script>
  <script src="../../shared/js/stadium.js"></script>
  <script src="../../shared/js/athlete.js"></script>
  <script src="../../shared/js/flick.js"></script>
  <script src="shotput.js"></script>
</body>
</html>
